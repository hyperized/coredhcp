# Demo stack for the terminal UI: the server built with its UI plus busybox
# clients that keep it busy. Driven by `make demo`, which starts the server last.

name: ${COMPOSE_PROJECT_NAME:-coredhcp-demo}

# Anchored so docker's interface MACs, the static lease file and the macfilter
# deny list cannot drift apart. config-render receives the same values.
x-mac-client-a: &mac-client-a "02:00:00:d0:00:01"
x-mac-client-b: &mac-client-b "02:00:00:d0:00:02"
x-mac-client-c: &mac-client-c "02:00:00:d0:00:03"
x-mac-client-renew: &mac-client-renew "02:00:00:d0:00:04"
x-mac-client-dynamic: &mac-client-dynamic "02:00:00:d0:00:99"
x-mac-client-denied: &mac-client-denied "02:00:00:d0:de:ad"
# Only the starting address: client-churn rewrites it every few seconds.
x-mac-client-churn: &mac-client-churn "02:00:00:cb:00:00"

x-dhcp-client: &dhcp-client
  image: busybox:${BUSYBOX_TAG:-1.37.0}
  # tini as PID 1, so the client scripts get their teardown signal.
  init: true
  # udhcpc needs AF_PACKET and nothing else; the clients that add NET_ADMIN say
  # why where they do it.
  cap_drop: [ALL]
  cap_add: [NET_RAW]
  command: ["/bin/sh", "/src/scripts/run-client.sh"]
  volumes:
    - ./:/src:ro
  networks: [dhcp]
  # No depends_on the server: `docker compose run server` starts only that
  # service's own dependencies, so such a client would never start at all.

services:
  # Idles after rendering; a failed render leaves it unhealthy, so the server
  # refuses to start rather than parsing a half-written config.
  config-render:
    image: busybox:${BUSYBOX_TAG:-1.37.0}
    init: true
    # Only writes files, and staying off the bridge keeps it out of the demo.
    network_mode: none
    # `;` not `&&`, so a failed render idles unhealthy instead of exiting.
    command: ["/bin/sh", "-c", "/src/scripts/render-config.sh; trap 'exit 0' TERM INT; sleep ${SERVICE_LINGER:-86400} & wait $$!"]
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/coredhcp/config.yaml"]
      interval: 1s
      timeout: 2s
      retries: 30
    environment:
      NET: ${DEMO_NET_PREFIX:-172.31.242}
      LEASE_TIME: ${DHCP_LEASE_TIME:-60s}
      MAC_A: *mac-client-a
      MAC_B: *mac-client-b
      MAC_C: *mac-client-c
      MAC_DENIED: *mac-client-denied
    volumes:
      - ./:/src:ro
      - coredhcp-conf:/etc/coredhcp

  # The server and its UI in one process; `make demo` runs it in the foreground.
  server:
    build:
      context: ../..
      dockerfile: test/demo/Dockerfile
    depends_on:
      config-render:
        condition: service_healthy
    command: ["--conf", "/etc/coredhcp/config.yaml", "--loglevel", "${COREDHCP_LOGLEVEL:-info}"]
    tty: true
    stdin_open: true
    environment:
      # The image carries no terminfo database, so the UI is limited to what
      # tcell compiles in. Override TERM if yours is exotic and it draws blank.
      TERM: ${TERM:-xterm-256color}
    # NET_BIND_SERVICE for udp/67; NET_RAW for SO_BINDTODEVICE and the AF_PACKET
    # socket that unicasts to clients with no address yet.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, NET_RAW]
    volumes:
      - coredhcp-conf:/etc/coredhcp:ro
      # A named volume inherits the image directory's owner, the unprivileged
      # server user; a bind mount would arrive root-owned and fail to open.
      - coredhcp-leasedb:/var/lib/coredhcp
    networks:
      dhcp:
        # Fixed, because the server_id in the rendered config says .2.
        ipv4_address: ${DEMO_NET_PREFIX:-172.31.242}.2

  # Take, hold and release on coprime intervals, so the requests keep
  # reordering. A release is sent from the leased address, hence NET_ADMIN.
  client-a:
    <<: *dhcp-client
    mac_address: *mac-client-a
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-a
      CLIENT_MODE: cycle
      CLIENT_HOLD: 5
      CLIENT_INTERVAL: 7
      UDHCPC_SCRIPT: udhcpc-hold.sh

  client-b:
    <<: *dhcp-client
    mac_address: *mac-client-b
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-b
      CLIENT_MODE: cycle
      CLIENT_HOLD: 5
      CLIENT_INTERVAL: 11
      UDHCPC_SCRIPT: udhcpc-hold.sh
      # The broadcast flag, so this client covers the UDP broadcast reply path
      # while the others exercise layer-2 unicast.
      UDHCPC_EXTRA_ARGS: "-B"

  client-c:
    <<: *dhcp-client
    mac_address: *mac-client-c
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-c
      CLIENT_MODE: cycle
      CLIENT_HOLD: 5
      CLIENT_INTERVAL: 13
      UDHCPC_SCRIPT: udhcpc-hold.sh

  # Holds its lease instead of releasing it, so the UI shows a renewing client.
  client-renew:
    <<: *dhcp-client
    mac_address: *mac-client-renew
    # A renewal is answered by unicast to the leased address, so a client that
    # does not hold it never sees the reply. See scripts/udhcpc-hold.sh.
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-renew
      CLIENT_MODE: renew
      UDHCPC_SCRIPT: udhcpc-hold.sh

  # No static lease for this MAC, so it falls through to the range plugin.
  client-dynamic:
    <<: *dhcp-client
    mac_address: *mac-client-dynamic
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-dynamic
      CLIENT_MODE: cycle
      CLIENT_HOLD: 5
      CLIENT_INTERVAL: 9
      UDHCPC_SCRIPT: udhcpc-hold.sh

  # On the macfilter deny list, so every request is dropped before any plugin
  # sees it. Nothing to hold or release, so it keeps the plain script.
  client-denied:
    <<: *dhcp-client
    mac_address: *mac-client-denied
    environment:
      CLIENT_NAME: client-denied
      CLIENT_MODE: cycle
      CLIENT_HOLD: 1
      CLIENT_INTERVAL: 5
      UDHCPC_TRIES: 2
      UDHCPC_INTERVAL: 2
      # -n so it gives up after those tries instead of retrying on its own
      # schedule.
      UDHCPC_EXTRA_ARGS: "-n"

  # A new MAC every few seconds and never a release, so the pool fills up and
  # the range plugin starts refusing until leases expire.
  client-churn:
    <<: *dhcp-client
    mac_address: *mac-client-churn
    # The one client that reprograms its own hardware address.
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      CLIENT_NAME: client-churn
      CLIENT_MODE: churn
      CHURN_INTERVAL: 4
      UDHCPC_TRIES: 2
      UDHCPC_INTERVAL: 2

networks:
  dhcp:
    driver: bridge
    ipam:
      driver: default
      config:
        # Docker's IPAM only allocates out of ip_range, which keeps it clear of
        # the static leases, the pool and the server's fixed address.
        - subnet: ${DEMO_NET_PREFIX:-172.31.242}.0/24
          ip_range: ${DEMO_NET_PREFIX:-172.31.242}.192/26
          gateway: ${DEMO_NET_PREFIX:-172.31.242}.1

volumes:
  coredhcp-conf:
  coredhcp-leasedb:
