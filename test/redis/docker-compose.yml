# Integration stack for the redis plugin. Nothing DHCP happens on the wire; the
# tests drive the plugin's handlers in-process and only the backend is real.

name: ${COMPOSE_PROJECT_NAME:-coredhcp-redis-itest}

services:
  redis:
    image: redis:${REDIS_TAG:-8.10.0-alpine}
    # A password on purpose, so the AUTH path gets exercised too.
    command: ["redis-server", "--requirepass", "${REDIS_TEST_PASSWORD:-coredhcp-itest}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_TEST_PASSWORD:-coredhcp-itest}", "--no-auth-warning", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Exits with the test result: `up --exit-code-from tester` returns its code.
  tester:
    image: golang:${GO_TAG:-1.26}
    depends_on:
      redis:
        condition: service_healthy
    working_dir: /src
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_TEST_PASSWORD:-coredhcp-itest}
      GOFLAGS: -buildvcs=false
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: ["go", "test", "-count=1", "-race", "-tags=integration", "-run", "Integration", "-v", "./plugins/redis/"]
    volumes:
      - ../..:/src:ro
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  gomodcache:
  gobuildcache:
