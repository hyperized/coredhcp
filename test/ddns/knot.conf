# Minimal Knot config for the ddns plugin's integration tests. Zone files
# under ./zones are mounted read-only; zonefile-sync is off so Knot only
# ever appends accepted updates to its journal under /storage and never
# tries to write back to the read-only mount.
#
# The ACL below is deliberately as wide as the plugin's own key: one key,
# every name in the zone. What keeps one client from taking another's name
# is not this ACL but the DHCID prerequisites the plugin sends, and testing
# those means letting Knot be the one that refuses them. Knot serves DHCID
# (type 49) and weighs RFC 2136 prerequisites natively, so nothing here has
# to name either.
#
# A deployment can tighten this further with Knot's update-owner settings,
# which hold a key to a set of owner names. That is worth doing where the
# DHCP server only ever writes a known set of names, and it is orthogonal
# to what these tests check.
server:
    rundir: "/rundir"
    user: knot:knot
    listen: [ 0.0.0.0@53, ::@53 ]

log:
  - target: stdout
    any: info

database:
    storage: "/storage"

key:
  - id: ddns-key
    algorithm: hmac-sha256
    secret: Y29yZWRoY3AtZGRucy1nb2xkZW4tdGVzdC1rZXkhISE=

acl:
  - id: ddns-acl
    key: ddns-key
    action: update

template:
  - id: default
    storage: "/zones"
    zonefile-sync: -1
    zonefile-load: difference-no-serial
    journal-content: all
    acl: ddns-acl

zone:
  - domain: home.lan
    file: "home.lan.zone"

  - domain: 0.0.10.in-addr.arpa
    file: "0.0.10.in-addr.arpa.zone"

  - domain: 8.b.d.0.1.0.0.2.ip6.arpa
    file: "8.b.d.0.1.0.0.2.ip6.arpa.zone"
