# Integration stack for the ddns plugin against a real Knot DNS server. Nothing
# DHCP happens on the wire; the tests drive the plugin's update logic directly.

name: ${COMPOSE_PROJECT_NAME:-coredhcp-ddns-itest}

services:
  knot:
    image: docker.io/cznic/knot:${KNOT_TAG:-v3.5.8}
    command: ["knotd", "-c", "/config/knot.conf"]
    volumes:
      - ./knot.conf:/config/knot.conf:ro
      - ./zones:/zones:ro
      - knot-storage:/storage
    # Knot only answers once the zone is loaded, so this is a readiness check
    # as much as a liveness one.
    healthcheck:
      test: ["CMD-SHELL", "kdig @127.0.0.1 home.lan SOA +short | grep -q ns.home.lan"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Exits with the test result: `up --exit-code-from tester` returns its code.
  tester:
    image: golang:${GO_TAG:-1.26}
    depends_on:
      knot:
        condition: service_healthy
    working_dir: /src
    environment:
      DDNS_SERVER: knot:53
      DDNS_ZONE: home.lan
      DDNS_KEY: ddns-key
      DDNS_TSIG_SECRET: ${DDNS_TSIG_SECRET:-Y29yZWRoY3AtZGRucy1nb2xkZW4tdGVzdC1rZXkhISE=}
      DDNS_REVERSE4: 10.0.0.0/24
      DDNS_REVERSE6: 2001:db8::/32
      GOFLAGS: -buildvcs=false
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /root/.cache/go-build
    command: ["go", "test", "-count=1", "-race", "-tags=integration", "-run", "Integration", "-v", "./plugins/ddns/"]
    volumes:
      - ../..:/src:ro
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  # Accepted updates land here, not in the read-only zone mount.
  knot-storage:
  gomodcache:
  gobuildcache:
