# End-to-end DHCPv4 test stack: coredhcp from the repo Dockerfile, busybox
# clients on a shared bridge, and a checker. Driven by `make test-compose`.

name: ${COMPOSE_PROJECT_NAME:-coredhcp-dhcp4-itest}

# Anchored so docker's interface MACs and the static lease file cannot drift
# apart. config-render receives the same values.
x-mac-client-a: &mac-client-a "02:00:00:c0:de:01"
x-mac-client-b: &mac-client-b "02:00:00:c0:de:02"
x-mac-client-c: &mac-client-c "02:00:00:c0:de:03"
x-mac-client-dynamic: &mac-client-dynamic "02:00:00:c0:de:99"

x-dhcp-client: &dhcp-client
  image: busybox:${BUSYBOX_TAG:-1.37.0}
  # tini as PID 1: a bare `sleep` ignores SIGTERM, so every teardown would
  # otherwise sit out the kill timeout.
  init: true
  depends_on:
    server-ready:
      condition: service_healthy
  # udhcpc needs AF_PACKET; no NET_ADMIN, because the capture script never
  # configures the interface.
  cap_drop: [ALL]
  cap_add: [NET_RAW]
  command: ["/bin/sh", "/src/scripts/run-client.sh"]
  volumes:
    - ./:/src:ro
    - results:/results
  networks: [dhcp]

services:
  # Idles instead of exiting: compose disarms `up --exit-code-from checker` as
  # soon as another container exits first, so the checker must be the only one.
  config-render:
    image: busybox:${BUSYBOX_TAG:-1.37.0}
    init: true
    # Only writes files, and staying off the bridge avoids a default network.
    network_mode: none
    # `;` not `&&`, so a failed render idles unhealthy instead of exiting.
    command: ["/bin/sh", "-c", "/src/scripts/render-config.sh; trap 'exit 0' TERM INT; sleep ${SERVICE_LINGER:-3600} & wait $$!"]
    healthcheck:
      test: ["CMD", "test", "-f", "/etc/coredhcp/config.yaml"]
      interval: 1s
      timeout: 2s
      retries: 30
    environment:
      NET: ${DHCP_NET_PREFIX:-172.31.240}
      LEASE_TIME: ${DHCP_LEASE_TIME:-300s}
      MAC_A: *mac-client-a
      MAC_B: *mac-client-b
      MAC_C: *mac-client-c
    volumes:
      - ./:/src:ro
      - coredhcp-conf:/etc/coredhcp

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      config-render:
        condition: service_healthy
    command: ["--conf", "/etc/coredhcp/config.yaml", "--loglevel", "${COREDHCP_LOGLEVEL:-info}"]
    # NET_BIND_SERVICE for udp/67; NET_RAW for SO_BINDTODEVICE and the AF_PACKET
    # socket that unicasts to clients with no address yet.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, NET_RAW]
    volumes:
      - coredhcp-conf:/etc/coredhcp:ro
      # A named volume inherits the image directory's owner, the unprivileged
      # server user; a bind mount would arrive root-owned and fail to open.
      - coredhcp-leasedb:/var/lib/coredhcp
    networks:
      dhcp:
        # Fixed, because the server_id the clients check is baked into the
        # rendered config.
        ipv4_address: ${DHCP_NET_PREFIX:-172.31.240}.2

  # Tells the clients when udp/67 is bound. A sidecar because the server image
  # is distroless and has no shell; 0043 is port 67 in /proc/net/udp's hex.
  server-ready:
    image: busybox:${BUSYBOX_TAG:-1.37.0}
    init: true
    depends_on: [server]
    # Joins the server's netns, so no `networks:` and no address of its own.
    network_mode: "service:server"
    cap_drop: [ALL]
    command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; sleep ${SERVICE_LINGER:-3600} & wait $$!"]
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0043 ' /proc/net/udp"]
      interval: 1s
      timeout: 2s
      retries: 30

  # Three clients with a static lease, one without, to cover the range plugin.
  client-a:
    <<: *dhcp-client
    mac_address: *mac-client-a
    environment:
      CLIENT_NAME: client-a

  client-b:
    <<: *dhcp-client
    mac_address: *mac-client-b
    environment:
      CLIENT_NAME: client-b
      # The broadcast flag, so this client covers the UDP broadcast reply path
      # while the others exercise layer-2 unicast.
      UDHCPC_EXTRA_ARGS: "-B"

  client-c:
    <<: *dhcp-client
    mac_address: *mac-client-c
    environment:
      CLIENT_NAME: client-c

  client-dynamic:
    <<: *dhcp-client
    mac_address: *mac-client-dynamic
    environment:
      CLIENT_NAME: client-dynamic

  # Decides the run: `up --exit-code-from checker` returns this exit code.
  checker:
    image: busybox:${BUSYBOX_TAG:-1.37.0}
    init: true
    depends_on: [client-a, client-b, client-c, client-dynamic]
    cap_drop: [ALL]
    command: ["/bin/sh", "/src/scripts/check-leases.sh"]
    environment:
      # Adding a client service means adding it here too.
      EXPECTED_CLIENTS: "client-a client-b client-c client-dynamic"
      DYNAMIC_CLIENTS: "client-dynamic"
      CHECK_TIMEOUT: ${CHECK_TIMEOUT:-90}
    volumes:
      - ./:/src:ro
      - results:/results
      - coredhcp-conf:/etc/coredhcp:ro
    networks: [dhcp]

networks:
  dhcp:
    driver: bridge
    ipam:
      driver: default
      config:
        # Docker's IPAM only allocates out of ip_range, which keeps it clear of
        # the static leases, the dynamic pool and the server's fixed address.
        - subnet: ${DHCP_NET_PREFIX:-172.31.240}.0/24
          ip_range: ${DHCP_NET_PREFIX:-172.31.240}.192/26
          gateway: ${DHCP_NET_PREFIX:-172.31.240}.1

volumes:
  coredhcp-conf:
  coredhcp-leasedb:
  results:
