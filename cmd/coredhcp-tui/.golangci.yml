version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - predeclared
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Tests may use weak randomness and build SQL strings for fixtures.
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/coredhcp/coredhcp
