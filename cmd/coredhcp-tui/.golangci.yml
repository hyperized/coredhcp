version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - iface
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    exhaustive:
      # tcell.Key runs to a couple of hundred constants and the key handlers
      # name the handful they act on, so a default is what makes those
      # switches complete.
      default-signifies-exhaustive: true
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - common-false-positives
    rules:
      # Tests may use weak randomness and build SQL strings for fixtures.
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/coredhcp/coredhcp
