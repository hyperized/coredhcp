name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.25', '1.26']
    env:
      # A step's `if` can read neither the secrets context nor its own env, so
      # the decision sits here while the token stays on the upload steps.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # setup-go keys its cache on the root go.mod; without both modules in
          # the key the TUI's dependencies are fetched twice.
          cache-dependency-path: |
            go.sum
            cmd/coredhcp-tui/go.sum
      - name: run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: report coverage to codecov
        # Forks run without a codecov token; skip the upload rather than fail.
        if: env.HAS_CODECOV_TOKEN == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.txt
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
      # A module of its own, so the `go test ./...` above never reaches it.
      - name: run unit tests for the TUI module
        working-directory: cmd/coredhcp-tui
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: report TUI coverage to codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cmd/coredhcp-tui/coverage.txt
          disable_search: true
          flags: tui-unittests
          fail_ci_if_error: true
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.25', '1.26']
    env:
      # A step's `if` can read neither the secrets context nor its own env, so
      # the decision sits here while the token stays on the upload steps.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: set up network namespaces
        run: ./test/integration/setup-netns.sh
      - name: run integration tests
        env:
          GOCOVERDIR: ${{ github.workspace }}/.cover
        run: |
          set -eu
          mkdir -p "$GOCOVERDIR"
          for d in test/integration/*/; do
              pushd "$d"
              # A directory with no integration-tagged package is not an error.
              if ! go list -tags=integration . >/dev/null 2>&1; then
                  echo "::notice file=${d}::no integration tests in ${d}"
                  popd
                  continue
              fi
              go build -tags=integration -race -cover -coverpkg=github.com/coredhcp/coredhcp/... .
              testbin=$(basename "$d")
              sudo --preserve-env=GOCOVERDIR "./${testbin}"
              popd
          done
          go tool covdata textfmt -i="$GOCOVERDIR" -o=coverage.txt
      - name: report coverage to codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.txt
          disable_search: true
          flags: integtests
          fail_ci_if_error: true
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: DHCPv4 end-to-end over a bridge network
        run: make test-compose
  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: redis plugin against a real Redis server
        run: make test-redis
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: benchmarks compile and run once
        run: go test -run='^$' -bench=. -benchtime=1x ./...
