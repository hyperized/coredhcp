name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.25', '1.26']
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          # setup-go keys its cache on the root go.mod by default; both modules
          # have to be in the key or the TUI's dependencies are fetched twice.
          cache-dependency-path: |
            go.sum
            cmd/coredhcp-tui/go.sum
      - name: run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: report coverage to codecov
        # The fork runs without a codecov token; skip the upload rather than
        # failing the build over it.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.txt
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
      # The terminal UI is a module of its own, so `go test ./...` above never
      # reaches it. Same flags, its own profile and codecov flag.
      - name: run unit tests for the TUI module
        working-directory: cmd/coredhcp-tui
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: report TUI coverage to codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: cmd/coredhcp-tui/coverage.txt
          disable_search: true
          flags: tui-unittests
          fail_ci_if_error: true
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.25', '1.26']
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: set up network namespaces
        run: ./test/integration/setup-netns.sh
      - name: run integration tests
        env:
          GOCOVERDIR: ${{ github.workspace }}/.cover
        run: |
          mkdir -p "$GOCOVERDIR"
          for d in test/integration/*/; do
              pushd "$d"
              go build -tags=integration -race -cover -coverpkg=github.com/coredhcp/coredhcp/... .
              testbin=$(basename "$d")
              test -x "${testbin}" || echo "::error file=${d}::missing binary for integration test ${d}"
              # only run it if it was built - i.e. if there are integ tests
              test -x "${testbin}" && sudo --preserve-env=GOCOVERDIR "./${testbin}"
              if [ $? -ne 0 ]; then
                echo "::error file=${d}::Execution of integration tests for ${d} failed"
              fi
              popd
          done
          go tool covdata textfmt -i="$GOCOVERDIR" -o=coverage.txt
      - name: report coverage to codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.txt
          disable_search: true
          flags: integtests
          fail_ci_if_error: true
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: DHCPv4 end-to-end over a bridge network
        run: make test-compose
  redis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: redis plugin against a real Redis server
        run: make test-redis
  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: benchmarks compile and run once
        run: go test -run='^$' -bench=. -benchtime=1x ./...
