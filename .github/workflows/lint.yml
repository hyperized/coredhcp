name: Lint

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # golangci-lint lints one module at a time, and the UI is its own.
        module: ['.', 'cmd/coredhcp-tui']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # setup-go keys its cache on the root go.mod; without both modules in
          # the key the TUI's dependencies are fetched twice.
          cache-dependency-path: |
            go.sum
            cmd/coredhcp-tui/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
