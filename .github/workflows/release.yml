name: Release

on:
  push:
    tags:
      - 'v*'

# Each job asks for the one scope it needs, so a compromised step in the
# image job cannot reach the release, or the reverse.
permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing mints a short-lived OIDC token instead of holding a
      # key, and the job has to be allowed to mint it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # QEMU is not needed while the runtime stage has no RUN steps (the Go
      # build cross-compiles natively), but it keeps a future RUN from
      # breaking arm64 builds mysteriously.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max records every build step and its inputs, not just the
          # final materials.
          provenance: mode=max
          sbom: true
      # Sign the digest, not a tag: a tag can be repointed at another image
      # later, a digest cannot.
      - name: sign the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # setup-go keys its cache on the root go.mod by default; both modules
          # have to be in the key or the TUI's dependencies are fetched twice.
          cache-dependency-path: |
            go.sum
            cmd/coredhcp-tui/go.sum
      # The terminal UI ships as a second binary per platform. It is not in the
      # container image: the Dockerfile builds ./cmd/coredhcp only.
      - name: build release binaries
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "dist/coredhcp-linux-$arch" ./cmd/coredhcp
            (cd cmd/coredhcp-tui && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "$GITHUB_WORKSPACE/dist/coredhcp-tui-linux-$arch" .)
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
