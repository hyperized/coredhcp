name: Fuzz

on:
  schedule:
    - cron: '14 3 * * 1'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: fuzz every target
        run: make fuzz FUZZTIME=90s
